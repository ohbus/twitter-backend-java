name: PR Checker

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Cache Spotless Index
        uses: actions/cache@v6
        with:
          path: ~/.spotless
          key: ${{ runner.os }}-spotless-${{ hashFiles('**/pom.xml') }}
      - name: Check fork analysis revision guard
        run: python3 .github/tests/test_sonar_revision.py
      - name: Run Spotless Check
        run: ./mvnw spotless:check

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Record analyzed revision
        run: git rev-parse HEAD > sonar-revision.txt
      - name: Run Maven Verify
        run: ./mvnw -B clean verify
      - name: Prepare Sonar libraries
        run: ./mvnw -B dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=target/sonar-libraries
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-binary
          path: target/*.jar
          retention-days: 1
      - name: Upload Sonar inputs
        uses: actions/upload-artifact@v7
        with:
          name: pr-sonar-input
          path: |
            sonar-revision.txt
            target/classes/
            target/test-classes/
            target/sonar-libraries/
            target/site/jacoco/jacoco.xml
            target/surefire-reports/
          if-no-files-found: error
          retention-days: 1

  docker-smoke:
    name: Docker Build Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-binary
          path: target/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run Docker Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: pr-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
