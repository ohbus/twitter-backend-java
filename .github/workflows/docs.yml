name: Documentation

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'README.md'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/docs.yml'
      - 'src/main/resources/application.properties'
      - 'src/main/resources/application-test.properties'
      - 'src/main/java/xyz/subho/clone/twitter/config/OpenApiConfig.java'
      - 'src/main/java/xyz/subho/clone/twitter/constant/**'
      - 'src/main/java/xyz/subho/clone/twitter/controller/**'
      - 'src/main/java/xyz/subho/clone/twitter/model/**'
      - 'src/main/java/xyz/subho/clone/twitter/security/SecurityConfig.java'
      - 'src/test/java/xyz/subho/clone/twitter/OpenApiDocumentationTest.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect documentation changes
        if: github.event_name == 'pull_request'
        id: documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"; then
            echo '::error::Unable to compute the pull-request diff'
            exit 1
          fi
          if grep -zEq '^(docs/|zensical\.toml$|README\.md$|pom\.xml$|mvnw$|\.mvn/|\.github/workflows/docs\.yml$|src/main/resources/application(-test)?\.properties$|src/main/java/xyz/subho/clone/twitter/(config/OpenApiConfig\.java$|constant/|controller/|model/|security/SecurityConfig\.java$)|src/test/java/xyz/subho/clone/twitter/OpenApiDocumentationTest\.java$)' "$changed_paths"; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          else
            grep_status=$?
            if [ "$grep_status" -eq 1 ]; then
              echo 'affected=false' >> "$GITHUB_OUTPUT"
            else
              echo '::error::Unable to match changed documentation paths'
              exit 1
            fi
          fi
      - name: Set up Microsoft JDK 25
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'maven'
      - name: Export OpenAPI
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: ./mvnw -B -Dtest=OpenApiDocumentationTest test
      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: docs/tooling/requirements.txt
      - name: Install Zensical
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: 'pip install --require-hashes --only-binary :all: -r docs/tooling/requirements.txt'
      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/tooling/package-lock.json
      - name: Install API documentation tooling
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: npm --prefix docs/tooling ci --ignore-scripts
      - name: Build Markdown site
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: zensical build --clean --strict
      - name: Validate and build API reference
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: |
          npm --prefix docs/tooling run api:lint
          npm --prefix docs/tooling run api:build
          cp target/generated-docs/openapi.json site/api/openapi.json
        env:
          REDOCLY_TELEMETRY: off
      - name: Check mobile layout
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        run: npm --prefix docs/tooling run site:mobile-check
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' || steps.documentation.outputs.affected == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
