###### THIS IS THE ROOT PROPERTIES ######

# =======================================
# ========== ACTIVE PROPERTIES ==========
# =======================================
# Select a profile explicitly at deployment time (for example, prod).


spring.application.name=TwitterClone
spring.threads.virtual.enabled=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
spring.mvc.apiversion.enabled=true
spring.mvc.apiversion.default-version=1
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# Enable Liquibase
spring.liquibase.enabled=true

# Specify the path to the master changelog file
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# IMPORTANT: Disable Hibernate's automatic table creation
# This prevents conflicts. Liquibase is now in charge of the schema.
spring.jpa.hibernate.ddl-auto=validate

logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG