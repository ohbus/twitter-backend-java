### THIS IS THE DEFAULT PROPERTIES ###

jwt.secret=test-only-secret-that-is-at-least-32-characters-long
jwt.expiration=3600000
jwt.refreshExpiration=604800000

# ====================================
# =========== DATA SOURCE ============
# ====================================

spring.datasource.url=jdbc:h2:mem:twitter;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# ====================================
# ========= JPA / HIBERNATE ==========
# ====================================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).
# Show or not log for each sql query
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =====================================
# ========= SPRING SECURITY ===========
# =====================================


